name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "exe-tool/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        working-directory: exe-tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build exe
        working-directory: exe-tool
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --add-data "config.json;." --collect-data tkinterdnd2 --name "南方分中心舆情质检辅助工具" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: exe-tool/dist/南方分中心舆情质检辅助工具
